html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	overscroll-behavior: none;
}

body {
	color: #f4e4c1;
	background-color: #2b1a10;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace;
}

#canvas {
	display: block;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#status {
	position: fixed;
	inset: 0;
	background-color: #2b1a10;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;
	padding: 0 24px;
	text-align: center;
}

#status-cat {
	width: 120px;
	height: 120px;
	image-rendering: pixelated;
	animation: bob 1.2s steps(2) infinite;
}

@keyframes bob {
	50% { transform: translateY(-6px); }
}

#status-title {
	font-size: 28px;
	letter-spacing: 6px;
	font-weight: bold;
}

#status-bar {
	width: min(70vw, 320px);
	height: 14px;
	border: 3px solid #a0703c;
	background: #3b2416;
	box-sizing: content-box;
}

#status-fill {
	height: 100%;
	width: 0;
	background: #7fd18b;
	transition: width 0.2s linear;
}

#status-fill.indeterminate {
	width: 30%;
	animation: slide 1.2s ease-in-out infinite alternate;
}

@keyframes slide {
	from { margin-left: 0; }
	to { margin-left: 70%; }
}

#status-text {
	font-size: 15px;
	min-height: 1.3em;
}

#status-tip {
	font-size: 13px;
	opacity: 0.7;
	max-width: 320px;
	line-height: 1.4;
}

#status-notice {
	display: none;
	background-color: #5b3943;
	border: 2px solid #9b3943;
	color: #f4e4c1;
	line-height: 1.4;
	padding: 14px;
	max-width: 340px;
	font-size: 14px;
}
		</style>

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":292840,"index.wasm":18513518},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusFill = document.getElementById('status-fill');
	const statusText = document.getElementById('status-text');
	const statusTip = document.getElementById('status-tip');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;

	const TIPS = [
		'Mẹo: tưới cây giúp cây lớn nhanh hơn 25%.',
		'Mẹo: cây vẫn lớn khi bạn đóng game.',
		'Mẹo: lần sau mở game sẽ nhanh hơn nhiều (trình duyệt đã lưu sẵn).',
		'Học xong rồi thì về vườn với mèo một lát nhé.',
		'Mèo tam thể gần như luôn là mèo cái: gen màu cam nằm trên nhiễm sắc thể X.',
	];
	statusTip.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];

	function mb(bytes) {
		return (bytes / 1048576).toFixed(1);
	}

	function hideStatus() {
		statusOverlay.remove();
		initializing = false;
	}

	function displayFailureNotice(err) {
		console.error(err);
		let msg = 'Có lỗi không rõ.';
		if (err instanceof Error) {
			msg = err.message;
		} else if (typeof err === 'string') {
			msg = err;
		}
		statusNotice.textContent = 'Không mở được game. Bạn thử tải lại trang, hoặc mở bằng Chrome/Safari bản mới.\n\n' + msg;
		statusNotice.style.whiteSpace = 'pre-line';
		statusNotice.style.display = 'block';
		statusText.textContent = '';
		document.getElementById('status-bar').style.display = 'none';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		displayFailureNotice('Trình duyệt thiếu: ' + missing.join(', '));
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (!initializing) {
				return;
			}
			if (current > 0 && total > 0) {
				statusFill.classList.remove('indeterminate');
				statusFill.style.width = Math.min(100, (current / total) * 100) + '%';
				statusText.textContent = current >= total
					? 'Đang khởi động…'
					: 'Đang tải ' + mb(current) + ' / ' + mb(total) + ' MB';
			} else if (current > 0) {
				// Server sent no size (e.g. gzip): show bytes only.
				statusText.textContent = 'Đang tải ' + mb(current) + ' MB';
			}
		},
	}).then(hideStatus, displayFailureNotice);
}());
		</script>
